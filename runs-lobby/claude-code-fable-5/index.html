<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lobby Scene</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23aebbb0'/%3E%3Crect x='3' y='2' width='3' height='12' fill='%23e8ece6'/%3E%3Crect x='10' y='2' width='3' height='12' fill='%23e8ece6'/%3E%3C/svg%3E" />
    <style>
      /* Pale institutional tone from the very first paint — never dark. */
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #5e6f65;
        width: 100%;
        height: 100%;
      }
      canvas {
        display: block;
        /* desaturated high-contrast film grade; the green tint comes from
           the scene lighting so hues (uniform blue!) stay true */
        filter: saturate(0.85) contrast(1.28) brightness(0.86);
      }
    </style>
  </head>
  <body>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
