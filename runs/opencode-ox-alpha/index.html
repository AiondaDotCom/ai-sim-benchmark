<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Procedural Water Simulation</title>
    <style>
      /* Sky blue body background so there is no dark flash before WebGL paints. */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #87ceeb;
      }
      #app {
        position: fixed;
        inset: 0;
        background: linear-gradient(#4a90d9, #87ceeb);
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
