<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#87ceeb" />
    <title>Water Simulation</title>
    <style>
      /* Sky blue everywhere so there is never a dark flash before the canvas paints. */
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #87ceeb linear-gradient(#5aa9e3 0%, #87ceeb 50%, #b9e2f5 100%) no-repeat;
        cursor: none;
      }
      #app,
      #app canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
